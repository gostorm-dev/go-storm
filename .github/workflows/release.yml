name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          # Stamp release metadata so `storm version` is traceable in bug
          # reports; strip debug info for smaller download artifacts.
          LDFLAGS="-s -w \
            -X github.com/gostorm-dev/go-storm/internal/buildinfo.Version=${GITHUB_REF_NAME} \
            -X github.com/gostorm-dev/go-storm/internal/buildinfo.Commit=${GITHUB_SHA} \
            -X github.com/gostorm-dev/go-storm/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              ext=""
              [ "$GOOS" = "windows" ] && ext=".exe"
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o dist/storm-${GOOS}-${GOARCH}${ext} ./cmd/storm
            done
          done

      - name: Generate checksums
        run: (cd dist && sha256sum storm-* > checksums.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*